# The GPUI snapshot nd builds on, and the fork that carries nd's patch queue (ARCHITECTURE.md 2.1).
# `scripts/gpui-fork` reads and rewrites this file; bump it with `scripts/gpui-fork bump <version>`.

# gpui-pre-* on crates.io, and the zed commit that release snapshots.
crate_version = "0.3.11"
zed_rev = "f816e1f9263e3a8ef63c4baaa02e1441ce1c6038"

# `remote` is fetched for the snapshot; `branch` is the queue applied on it. `scripts/gpui-fork
# export` pushes the branch to `fork`, over ssh: zed's workflow files need a scope the gh token lacks.
remote = "https://github.com/zed-industries/zed"
fork = "git@github.com:FormalStudio/zed.git"
branch = "nd/f816e1f"
